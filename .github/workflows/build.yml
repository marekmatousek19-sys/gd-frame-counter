name: Build mod

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: Frame-Counter-Windows
          path: ${{ steps.build.outputs.build-output }}/*.geode
